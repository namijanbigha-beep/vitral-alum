<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4e79" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>ویترال</title>
  </head>
  <body>
    <div id="root"><p style="font-family:sans-serif;text-align:center;margin-top:30vh;color:#666">در حال بارگذاری ویترال…<br><small>اگر این پیام ماند، فایل را با مرورگر Chrome یا Safari باز کنید.</small></p></div>
    <script>
      // Never leave a blank page: show load errors instead (old browsers, blocked scripts, previews).
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && !r.dataset.ok) r.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:25vh;padding:16px;color:#a00">برنامه باز نشد. فایل را با مرورگر Chrome یا Safari باز کنید.<br><small dir="ltr">' + String(e.message || '').replace(/</g, '&lt;') + '</small></p>';
      });
      setTimeout(function () { var r = document.getElementById('root'); if (r && !r.dataset.ok && /بارگذاری/.test(r.textContent)) r.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:25vh;padding:16px;color:#a00">این پیش‌نمایش اجازه‌ی اجرای برنامه را نمی‌دهد. فایل را با مرورگر Chrome یا Safari باز کنید.</p>'; }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
